# FileVyasa Application Settings
# Non-secret configuration values
app:
  name: FileVyasa
  debug: false

api:
  host: 127.0.0.1
  port: 8000

database:
  # Path relative to working directory or absolute
  path: .filevyasa/app.db

llm:
  # LiteLLM supports 100+ LLM providers. See: https://docs.litellm.ai/docs/providers
  # Set API key via env var FILEVYASA_LLM_API_KEY (except for Ollama)
  
  # Ollama (local, no API key needed) - RECOMMENDED
  provider: ollama
  model: llama3.2
  api_base: http://localhost:11434

  # OpenAI
  # provider: openai
  # model: gpt-4o-mini  # or: gpt-4o, gpt-4-turbo, gpt-3.5-turbo
  
  # Anthropic
  # provider: anthropic
  # model: claude-3-5-sonnet-20241022  # or: claude-3-haiku-20240307, claude-3-opus-20240229
  
  # Google Gemini
  # provider: gemini
  # model: gemini-1.5-flash  # or: gemini-1.5-pro, gemini-2.0-flash
  
  # Groq (fast inference)
  # provider: groq
  # model: llama-3.1-70b-versatile  # or: llama-3.1-8b-instant, mixtral-8x7b-32768
  
  # DeepSeek (cost-effective)
  # provider: deepseek
  # model: deepseek-chat  # or: deepseek-coder
  
  # Together AI
  # provider: together_ai
  # model: meta-llama/Llama-3-70b-chat-hf
  
  # Fireworks AI
  # provider: fireworks_ai
  # model: accounts/fireworks/models/llama-v3p1-70b-instruct

extraction:
  max_content_lines: 50

google:
  # Path to Google service account credentials JSON file
  # Can also be set via FILEVYASA_GOOGLE_CREDENTIALS_PATH environment variable
  # Documents must be shared with the service account email for access
  credentials_path: null
scan:
  default_ignore_patterns:
  - .git
  - .svn
  - __pycache__
  - node_modules
  - .DS_Store
  - '*.pyc'
  - .venv
  - venv
