[project]
name = "filevyasa"
version = "1.1.0"
description = "AI-Powered Local File Organizer - Backend Service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "FileVyasa Team" }
]

dependencies = [
    # Core framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    
    # LLM Integration
    "litellm>=1.30.0",
    
    # Document extraction
    "markitdown>=0.1.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.10.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    
    # Media metadata
    "Pillow>=10.2.0",
    "exifread>=3.0.0",
    
    # Utilities
    "python-multipart>=0.0.6",
    "structlog>=24.1.0",
    "aiofiles>=23.2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
